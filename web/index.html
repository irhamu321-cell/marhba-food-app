<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>Marhba — Cuisine Maison & Plats de Mamans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/customer.css">
</head>
<body class="cust">

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" id="homeLink"><span class="mark">M</span><span id="brandText">Mar<span>hba</span></span></div>
    <button class="ghost langbtn" id="langBtn">العربية</button>
  </div>
</header>

<main>
  <section id="viewHome"></section>
  <section id="viewResto" class="hidden"></section>
  <section id="viewCart" class="hidden"></section>
  <section id="viewOrders" class="hidden"></section>
  <section id="viewTrack" class="hidden"></section>
  <section id="viewAccount" class="hidden"></section>
  <section id="viewHelp" class="hidden"></section>
  <section id="viewLegal" class="hidden"></section>
  <section id="viewAddresses" class="hidden"></section>
  <section id="viewGate" class="hidden"></section>
</main>

<div class="cartbar hidden" id="cartBar">
  <div class="cartbar-inner">
    <div>
      <div class="small muted" id="cartCount"></div>
      <div class="price" id="cartTotal"></div>
    </div>
    <button class="primary" id="goToCart">Voir le panier</button>
  </div>
</div>

<!-- Bottom tab bar. The button ids are the ones the rest of the app and the
     browser tests have always used, so moving them here changed nothing for
     the code that clicks them. -->
<nav class="tabbar" id="tabBar" aria-label="Navigation">
  <button class="tab" id="navHome" data-tab="home"><span class="ic"></span><span class="lbl"></span></button>
  <button class="tab" id="navOrders" data-tab="orders"><span class="ic"></span><span class="lbl"></span></button>
  <button class="tab tab-center" id="navCart" data-tab="cart"><span class="bubble"><span class="ic"></span><span class="count hidden" id="navCartCount"></span></span><span class="lbl"></span></button>
  <button class="tab" id="navHelp" data-tab="help"><span class="ic"></span><span class="lbl"></span></button>
  <button class="tab" id="navAccount" data-tab="account"><span class="ic"></span><span class="lbl"></span></button>
</nav>

<div id="modalRoot"></div>
<script type="module" src="/js/customer.js"></script>
</body>
</html>
