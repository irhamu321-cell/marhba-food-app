# ---------------------------------------------------------------------------
# Marhba — nginx
#
#   /etc/nginx/sites-available/marhba   then symlink into sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Get the certificate first, which also writes the ssl_certificate lines:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d marhba.ma -d www.marhba.ma
#
# Replace marhba.ma with your domain throughout.
#
# Caddy (deploy/Caddyfile) does all of this with a quarter of the lines and
# renews certificates by itself. Use nginx if it is already on the machine or
# if you know it well.
# ---------------------------------------------------------------------------

# Rate limits, declared once at the http level.
# Put these two lines in /etc/nginx/nginx.conf inside http { }, not here, if
# nginx complains that they are not allowed in this context.
limit_req_zone $binary_remote_addr zone=marhba_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=marhba_auth:10m rate=20r/m;

upstream marhba_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP exists only to send people to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name marhba.ma www.marhba.ma;

    # Leave this open so certbot can renew.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marhba.ma www.marhba.ma;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/marhba.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marhba.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The app caps uploads at 5 MB; this refuses a larger body before it
    # reaches Node at all.
    client_max_body_size 6m;
    client_body_timeout 60s;

    # -- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # Pre-compressed with zstd if the module is available; harmless if not.
    # zstd on;
    # zstd_types text/css text/javascript application/javascript application/json;

    # -- security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    access_log /var/log/nginx/marhba.access.log;
    error_log  /var/log/nginx/marhba.error.log;

    # -- the live order stream ---------------------------------------------
    #
    # This block is the one that matters, and the one that is wrong in most
    # copied configurations. nginx buffers a proxied response by default,
    # which would hold every order event until the connection closed — the
    # exact delay the stream exists to remove. The app also sends
    # X-Accel-Buffering: no, which nginx honours, but this is explicit.
    location = /api/restaurant/stream {
        proxy_pass http://marhba_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- login and verification codes --------------------------------------
    # Tighter limit: these are the endpoints worth guessing at. The app limits
    # them too, per identifier; this limits per address.
    location ~ ^/api/auth/(login|register|request-code|forgot-password|reset-password)$ {
        limit_req zone=marhba_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://marhba_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -- the rest of the API -----------------------------------------------
    location /api/ {
        limit_req zone=marhba_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://marhba_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -- uploaded pictures -------------------------------------------------
    # The filename is a UUID, so a URL's content never changes and may be
    # cached hard.
    location /uploads/ {
        proxy_pass http://marhba_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # -- the pages and their assets ----------------------------------------
    location / {
        proxy_pass http://marhba_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# A note on the two CDN entries in the CSP above
#
# The address picker loads Leaflet from unpkg.com, so the policy has to allow
# scripts from there. That means trusting unpkg: if it were ever compromised,
# the injected script would run on your pages with your customers' sessions.
#
# Two ways to remove that trust, in order of preference:
#
# 1. Host Leaflet yourself. Download leaflet.js, leaflet.css and the images
#    folder into web/vendor/leaflet/, change LEAFLET_CSS and LEAFLET_JS at the
#    top of web/js/addresses.js to those paths, and delete every
#    "https://unpkg.com" from the policy above. The map keeps working with no
#    outside script at all, and it also keeps working on a bad connection.
#
# 2. Add Subresource Integrity to the two tags in web/js/addresses.js. Copy
#    the hashes from unpkg's own page for leaflet@1.9.4 rather than from any
#    guide, including this one: a wrong hash silently stops the map loading.
#
# The tile images still come from openstreetmap.org either way, which is an
# image source and cannot execute anything.
# ---------------------------------------------------------------------------
